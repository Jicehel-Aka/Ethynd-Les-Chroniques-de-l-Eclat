[platformio]
src_dir = .
include_dir = .

[env:gamebuino_aka_esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
build_flags =
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DUSER_SETUP_LOADED=1
  -DILI9341_DRIVER=1
  -DTFT_WIDTH=240
  -DTFT_HEIGHT=320
  -DUSE_HSPI_PORT=1
  -DTFT_MOSI=11
  -DTFT_SCLK=12
  -DTFT_MISO=13
  -DTFT_CS=10
  -DTFT_DC=9
  -DTFT_RST=14
  -DSPI_FREQUENCY=40000000
  -DLOAD_GLCD=1
  -O2
monitor_speed = 115200
lib_deps =
  bodmer/TFT_eSPI@^2.5.43
